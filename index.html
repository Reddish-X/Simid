<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Shrestha 💕</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💖</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Floating hearts background (generated by script.js) -->
  <div id="hearts-bg" aria-hidden="true"></div>
  <!-- Little hearts that follow the cursor -->
  <div id="sparkle-layer" aria-hidden="true"></div>

  <!-- ================= QUESTION SCREEN ================= -->
  <main class="screen" id="question-screen">
    <div class="card">
      <div class="big-emoji">🥺💘</div>
      <h1 class="title">Hey Shrestha…</h1>

      <!-- ════════════════════════════════════════════════════════════
           ✏️✏️✏️  PUT YOUR QUESTION HERE  ✏️✏️✏️
           Just replace the text between the <p> tags below 👇
           ════════════════════════════════════════════════════════════ -->
      <p class="question" id="question-text">Can I eyp? PLEASEEEE 🥺</p>

      <div class="buttons">
        <button class="btn btn-yes" id="btn-yes">Yes 💖</button>
        <button class="btn btn-no" id="btn-no">No 🙈</button>
      </div>

      <p class="no-counter" id="no-counter" hidden></p>
    </div>
  </main>

  <!-- ================= YES! SCREEN ================= -->
  <main class="screen hidden" id="end-screen">
    <div class="card end-card">
      <div class="big-emoji">💖✨</div>
      <h1 class="title">Yayyyy!! 🎉</h1>

      <!-- ════════════════════════════════════════════════════════════
           ✏️✏️✏️  PUT YOUR END TEXT HERE  ✏️✏️✏️
           Just replace the text between the <p> tags below 👇
           ════════════════════════════════════════════════════════════ -->
      <p class="end-text" id="end-text">YASSS THANKK UUU I WILL LICK IT SOOO GOOOODDD TRUST MEEE 🤤</p>
      <p class="end-sub">Forever yours 💕</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
